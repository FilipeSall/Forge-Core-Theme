<svg xmlns="http://www.w3.org/2000/svg" width="80" height="118" viewBox="0 0 80 118" fill="none">
  <defs>
    <linearGradient id="body" x1="8" y1="0" x2="72" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303030"/>
      <stop offset=".30" stop-color="#252525"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="80" y2="0">
      <stop stop-color="#4A4A4A"/>
      <stop offset=".25" stop-color="#222"/>
      <stop offset=".75" stop-color="#222"/>
      <stop offset="1" stop-color="#4A4A4A"/>
    </linearGradient>
    <filter id="redGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <path d="M18 2H62C70.8 2 78 9.2 78 18V118H2V18C2 9.2 9.2 2 18 2Z"
        fill="url(#body)" stroke="url(#edge)" stroke-width="2" filter="url(#shadow)"/>

  <!-- subtle inner chassis -->
  <path d="M15 9H65C69.4 9 73 12.6 73 17V114H7V17C7 12.6 10.6 9 15 9Z"
        stroke="#111" stroke-width="2" opacity=".9"/>

  <!-- industrial top bevels -->
  <path d="M9 18L18 9H27" stroke="#444" stroke-width="1.2" opacity=".65"/>
  <path d="M71 18L62 9H53" stroke="#444" stroke-width="1.2" opacity=".65"/>

  <!-- handle -->
  <rect x="27" y="18" width="26" height="8" rx="4" fill="#F1F1F1"/>
  <rect x="29" y="20" width="22" height="4" rx="2" fill="#D5D5D5"/>

  <!-- red energy slits -->
  <rect x="4" y="47" width="2" height="18" rx="1" fill="#FC435A" filter="url(#redGlow)"/>
  <rect x="74" y="47" width="2" height="18" rx="1" fill="#FC435A" filter="url(#redGlow)"/>

  <!-- transition line -->
  <path d="M9 112H71" stroke="#383838" stroke-width="1"/>
  <path d="M22 112H58" stroke="#FC435A" stroke-width="1" opacity=".75"/>
</svg>