<svg xmlns="http://www.w3.org/2000/svg" width="80" height="138" viewBox="0 0 80 138" fill="none">
  <defs>
    <linearGradient id="body" x1="40" y1="0" x2="40" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1A1A"/>
      <stop offset=".55" stop-color="#242424"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="well" cx="0" cy="0" r="1" gradientTransform="translate(40 92) rotate(90) scale(34)">
      <stop stop-color="#303030"/>
      <stop offset=".65" stop-color="#191919"/>
      <stop offset="1" stop-color="#0E0E0E"/>
    </radialGradient>
    <filter id="redGlow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>

  <path d="M2 0H78V116C78 127 69 136 58 136H22C11 136 2 127 2 116V0Z"
        fill="url(#body)" stroke="#383838" stroke-width="2" filter="url(#shadow)"/>

  <!-- chassis cuts -->
  <path d="M8 61L17 70V111L24 120H56L63 111V70L72 61"
        stroke="#343434" stroke-width="1.2" opacity=".8"/>
  <path d="M12 62L20 70" stroke="#FC435A" stroke-width="1.2" opacity=".65"/>
  <path d="M68 62L60 70" stroke="#FC435A" stroke-width="1.2" opacity=".65"/>

  <!-- launcher well -->
  <circle cx="40" cy="96" r="28" fill="url(#well)" stroke="#444" stroke-width="1.5"/>
  <circle cx="40" cy="96" r="30" stroke="#FC435A" stroke-width="1.4" opacity=".88" filter="url(#redGlow)"/>
  <circle cx="40" cy="96" r="23" stroke="#111" stroke-width="2"/>

  <!-- bottom energy lip -->
  <path d="M24 129H56" stroke="#FC435A" stroke-width="1.4" opacity=".9" filter="url(#redGlow)"/>
</svg>